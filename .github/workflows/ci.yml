name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Job 1: Named 'check', used for linting and type checking
  check:
    runs-on: ubuntu-latest
    steps:
      # Downloads your repository's code onto the virtual machine
      - uses: actions/checkout@v4
      # Installs 'uv' (the Python package manager) on the machine
      - uses: astral-sh/setup-uv@v6
      # Installs your Python project's dependencies exactly as locked
      - run: uv sync --frozen
      # Runs the Ruff linter to check for code quality issues in 'src' and 'tests'
      - run: uv run ruff check src tests
      # Runs the Ruff formatter to check if the code is formatted correctly
      - run: uv run ruff format --check src tests
      # Runs MyPy to check for Python static type errors
      - run: uv run mypy

  # Job 2: Named 'test', dedicated to running unit tests
  test:
    needs: check
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      # Executes the pytest framework to run your tests
      - run: uv run pytest

  # Job 3: Named 'upload_artifact', used to save files from the run
  upload_artifact:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create a file to upload
        run: echo "The build succeeded!" > result.txt

      - name: Upload file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-report
          path: result.txt

  # 4. The Discord job (Runs no matter what happens before it)
  notify:
    needs: [check, test, upload_artifact]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Send Discord Notification
      uses: rjstone/discord-webhook-notify@v1
      with:
        webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
        severity: info
        text: "CI build status for commit ${{ github.sha }}: ${{ job.status }}!"
